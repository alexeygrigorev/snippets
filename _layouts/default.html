<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | absolute_url }}">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1><a href="{{ '/' | absolute_url }}">{{ site.title | default: "Code Snippets" }}</a></h1>
            <nav>
                <a href="{{ '/' | absolute_url }}">Home</a>
                <a href="{{ '/tags.html' | absolute_url }}">Tags</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <main>
            {{ content }}
        </main>
    </div>

    <footer>
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} Code Snippets Collection &middot; <a href="https://github.com/alexeygrigorev/snippets">GitHub</a></p>
        </div>
    </footer>

    <script src="https://unpkg.com/lunr/lunr.js"></script>
    <script src="{{ '/assets/js/search.js' | absolute_url }}"></script>
    <script>
    document.querySelectorAll('pre').forEach(function(pre) {
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', function() {
            var code = pre.querySelector('code');
            var text = code ? code.textContent : pre.textContent;
            navigator.clipboard.writeText(text).then(function() {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(function() {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        });
        pre.appendChild(btn);
    });
    </script>
</body>
</html>
